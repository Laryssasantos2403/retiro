<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retiro: A criança que fui, a vida que escolho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#6e2a2e; --wine-deep:#5a1f26; --rose:#a8575f; --gold:#d9a94a; --gold-soft:#f1d596; --cream:#fbf1e1;
  --paper1:#f2cbbf; --paper2:#f6dcc4; --paper3:#f4e8c6;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--wine);
  background:radial-gradient(ellipse at 50% 20%,#fde7cc 0%,rgba(253,231,204,0) 60%),linear-gradient(180deg,#f9d3b4 0%,#efb1a0 55%,#c27775 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;
}
main{width:100%;max-width:560px}
.art{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 14px 40px rgba(90,31,38,.25)}
.panel{
  margin-top:16px;border-radius:24px;padding:22px 20px 24px;text-align:center;
  background:linear-gradient(180deg,#fff6e8,#f8dcc8);
  border:2px solid var(--gold);box-shadow:0 10px 30px rgba(90,31,38,.18);
}
.lead{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 14px;color:var(--wine-deep)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.4vw,12px)}
.box{border-radius:8px;padding:clamp(12px,3.4vw,18px) 2px;box-shadow:0 2px 6px rgba(110,42,46,.14);border:1px solid rgba(217,169,74,.45)}
.box:nth-child(1){background:var(--paper1);transform:rotate(-.7deg)}
.box:nth-child(2){background:var(--paper2);transform:rotate(.5deg)}
.box:nth-child(3){background:var(--paper3);transform:rotate(-.4deg)}
.box:nth-child(4){background:var(--paper2);transform:rotate(.7deg)}
.num{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,10vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.lab{margin-top:6px;font-size:clamp(.72rem,2.8vw,.88rem);color:var(--rose);font-weight:600}
.done{font-family:var(--script);font-size:clamp(2.2rem,10vw,3.3rem);margin:4px 0;color:var(--wine-deep)}
.when{margin:16px 0 0;font-size:.95rem;color:var(--rose)}
[hidden]{display:none}
</style>
</head>

<script>
// Início: 20/11/2026 às 15h (horário local do aparelho)
var target=new Date(2026,10,20,15,0,0).getTime();
var ids=["d","h","m","s"].map(function(i){return document.getElementById(i)});
function pad(n){return String(n).padStart(2,"0")}
function tick(){
  var diff=target-Date.now();
  if(diff<=0){
    ["grid","lead","when"].forEach(function(i){document.getElementById(i).hidden=true});
    document.getElementById("done").hidden=false;
    return;
  }
  var t=Math.floor(diff/1000);
  ids[0].textContent=pad(Math.floor(t/86400));
  ids[1].textContent=pad(Math.floor(t%86400/3600));
  ids[2].textContent=pad(Math.floor(t%3600/60));
  ids[3].textContent=pad(t%60);
  setTimeout(tick,250);
}
tick();
